spring:
  application:
    name: smartbank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartbank}
    username: ${DB_USER:smartbank}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
